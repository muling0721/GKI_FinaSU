          - SukiSU
          - BakaSU
          - FinaSU
        default: BakaSU

      # ==================== 可选配置 ====================
      version:
        description: "自定义版本名 (可选)"
        required: false
        type: string
      ksu_commit_override:
        description: "测试用：覆盖 KernelSU 检出的提交（留空=自动跟随最新 Release 的提交）"
        required: false
        type: string
        default: ""
      build_time:
        description: "自定义构建时间 (留空=自动获取当前北京时间) (示例 Sun Dec  1 08:10:00 UTC 2026)"
        required: false
        type: string
        default: ""

      # ==================== 选项配置 ====================
      use_kpm:
        description: "KPM 功能（仅SukiSU支持）"
        required: true
